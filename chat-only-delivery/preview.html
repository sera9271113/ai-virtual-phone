<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat 修改效果预览</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2329;
      --muted: #8b919a;
      --line: #eceef1;
      --active: #36a66f;
      --page: #fff;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      background: #fff;
    }

    .side-nav {
      position: relative;
      z-index: 20;
      width: 54px;
      flex: 0 0 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 14px;
      background: #fff;
      border-right: 1px solid #f2f3f4;
    }
    .exit, .nav-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #858b94;
      cursor: pointer;
    }
    .exit { margin-bottom: 18px; }
    .avatar {
      width: 34px;
      height: 34px;
      margin-bottom: 20px;
      border-radius: 50%;
      object-fit: cover;
      background: #eef0f2;
    }
    .nav-group { display: grid; gap: 12px; }
    .nav-btn.active {
      color: var(--active);
      background: transparent;
    }
    .nav-spacer { flex: 1; }

    .content {
      position: relative;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      background: #fff;
    }
    .view {
      position: absolute;
      inset: 0;
      display: none;
      overflow-y: auto;
      background: #fff;
    }
    .view.active { display: block; }

    .moments-header {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      right: 0;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: transparent;
    }
    .camera {
      position: absolute;
      right: 18px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
    }
    .cover {
      position: relative;
      height: 330px;
      overflow: hidden;
      background: #cbd2d6;
    }
    .cover > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 44%;
    }
    .cover-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, .08) 38%, rgba(255, 255, 255, .94) 100%);
    }
    .profile {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      color: #fff;
    }
    .profile-avatar {
      width: 76px;
      height: 76px;
      flex: 0 0 auto;
      border: 3px solid #fff;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }
    .profile h1 { margin: 0 0 5px; font-size: 22px; letter-spacing: 0; }
    .profile p { margin: 0; font-size: 13px; opacity: .9; }

    .feed { background: #fff; }
    .post {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 12px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
    }
    .post-avatar {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      object-fit: cover;
    }
    .post-name { margin: 0 0 7px; color: #526b92; font-size: 15px; font-weight: 700; }
    .post-text { margin: 0; font-size: 15px; line-height: 1.65; }
    .post-meta { margin-top: 11px; color: var(--muted); font-size: 12px; }

    .plain-header {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--line);
      background: #fff;
      font-weight: 700;
    }
    .contacts-body { padding: 20px; }
    .add-entry {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      text-align: left;
      cursor: pointer;
    }
    .add-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #fff;
      background: var(--active);
      font-size: 24px;
    }

    .add-friend {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: none;
      background: #fff;
    }
    .add-friend.open { display: block; }
    .add-header {
      position: relative;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .back-btn {
      position: absolute;
      left: 14px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #858b94;
      cursor: pointer;
    }
    .search-wrap { padding: 20px; }
    .search {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-radius: 8px;
      background: #f4f5f6;
      color: #8d9299;
    }
    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }

    .message-empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: #a0a5ac;
      background: #fff;
    }

    .settings-profile {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 24px 24px;
      background: #fff;
    }
    .settings-profile img {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      background: #f0f1f2;
    }
    .settings-profile h2 { margin: 0 0 7px; font-size: 20px; }
    .settings-profile p { margin: 0; color: var(--muted); font-size: 13px; }
    .settings-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 10px 24px 22px;
      border-bottom: 8px solid #f6f7f8;
      background: #fff;
    }
    .settings-action { text-align: center; color: #5e646c; font-size: 13px; }
    .settings-list { padding: 8px 24px; background: #fff; }
    .settings-row { padding: 17px 0; border-bottom: 1px solid var(--line); }

    @media (max-width: 640px) {
      .side-nav { width: 46px; flex-basis: 46px; }
      .exit, .nav-btn { width: 34px; height: 34px; }
      .cover { height: 310px; }
      .profile { left: 16px; right: 16px; }
      .post { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="side-nav" aria-label="Chat 导航">
      <button class="exit" aria-label="退出" title="退出">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l6-6-6-6M21 12H9M9 5H4v14h5"/></svg>
      </button>
      <img class="avatar" src="../public/images/default-moment-avatar.png" alt="">
      <div class="nav-group">
        <button class="nav-btn" data-view="messages" aria-label="消息" title="消息">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
        </button>
        <button class="nav-btn" data-view="contacts" aria-label="联系人" title="联系人">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 7.5M17 14a7 7 0 0 1 5 7"/></svg>
        </button>
        <button class="nav-btn active" data-view="moments" aria-label="动态" title="动态">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a6 6 0 0 1 3.5 10.9M20 15.5a6 6 0 0 1-11.2-.2M6.5 5.5A6 6 0 0 1 12 15"/></svg>
        </button>
      </div>
      <div class="nav-spacer"></div>
      <div class="nav-group">
        <button class="nav-btn" aria-label="钱包" title="钱包">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h14a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12"/><path d="M15 11h7v5h-7a2.5 2.5 0 0 1 0-5z"/></svg>
        </button>
        <button class="nav-btn" data-view="settings" aria-label="设置" title="设置">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </nav>

    <section class="content">
      <div class="view" id="messages">
        <div class="plain-header">消息</div>
        <div class="message-empty">暂无新消息</div>
      </div>

      <div class="view" id="contacts">
        <div class="plain-header">联系人</div>
        <div class="contacts-body">
          <button class="add-entry" id="open-add">
            <span class="add-icon">+</span>
            <span>添加朋友</span>
          </button>
        </div>
      </div>

      <div class="view active" id="moments">
        <header class="moments-header">
          <strong>动态</strong>
          <button class="camera" aria-label="发布朋友圈">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
        </header>
        <section class="cover">
          <img src="../public/default-wallpaper.webp" alt="朋友圈背景图">
          <div class="cover-shade"></div>
          <div class="profile">
            <img class="profile-avatar" src="../public/images/default-moment-avatar.png" alt="">
            <div>
              <h1>平和</h1>
              <p>make every day count</p>
            </div>
          </div>
        </section>
        <section class="feed">
          <article class="post">
            <img class="post-avatar" src="../public/xiaohongshu/avatars/default-03.png" alt="">
            <div>
              <p class="post-name">夏栀</p>
              <p class="post-text">今天的风很轻，适合把走过的路和看到的光都记下来。</p>
              <div class="post-meta">刚刚</div>
            </div>
          </article>
          <article class="post">
            <img class="post-avatar" src="../public/xiaohongshu/avatars/default-05.png" alt="">
            <div>
              <p class="post-name">林屿</p>
              <p class="post-text">周末计划：关掉提醒，去没有目的地的地方散步。</p>
              <div class="post-meta">12 分钟前</div>
            </div>
          </article>
        </section>
      </div>

      <div class="view" id="settings">
        <div class="plain-header">设置</div>
        <section class="settings-profile">
          <img src="../public/images/default-moment-avatar.png" alt="">
          <div>
            <h2>平和</h2>
            <p>微信号：pinghe</p>
          </div>
        </section>
        <section class="settings-actions">
          <div class="settings-action">朋友圈互动</div>
          <div class="settings-action">钱包</div>
          <div class="settings-action">个性设置</div>
        </section>
        <section class="settings-list">
          <div class="settings-row">聊天设置</div>
          <div class="settings-row">角色与联系人</div>
          <div class="settings-row">数据与备份</div>
        </section>
      </div>

      <section class="add-friend" id="add-friend">
        <header class="add-header">
          <button class="back-btn" id="close-add" aria-label="返回" title="返回">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1" />
            </svg>
          </button>
          添加朋友
        </header>
        <div class="search-wrap">
          <label class="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input placeholder="微信号/手机号">
          </label>
        </div>
      </section>
    </section>
  </main>

  <script>
    const navButtons = document.querySelectorAll('[data-view]');
    const views = document.querySelectorAll('.view');
    const addFriend = document.getElementById('add-friend');

    navButtons.forEach((button) => {
      button.addEventListener('click', () => {
        navButtons.forEach((item) => item.classList.remove('active'));
        views.forEach((view) => view.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(button.dataset.view).classList.add('active');
        addFriend.classList.remove('open');
      });
    });

    document.getElementById('open-add').addEventListener('click', () => addFriend.classList.add('open'));
    document.getElementById('close-add').addEventListener('click', () => addFriend.classList.remove('open'));
  </script>
</body>
</html>
